<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The installed app locks scale: a WKWebView gesture on a field can
         leave the visual viewport zoomed. The website keeps pinch-zoom so a
         narrow window can be recovered. viewport-fit=cover stays; CSS pads
         all four safe-area edges. Text controls are also >= 16px. -->
    <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function () {
        var protocol = '';
        try { protocol = String(location.protocol || ''); } catch (e) {}
        if (protocol === 'capacitor:' || protocol === 'ionic:' || protocol === 'file:') return;
        var meta = document.getElementById('viewport-meta');
        if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
      })();
    </script>
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="description" content="MoGOT — Macau neighborly secondhand bargaining" />
    <meta name="apple-mobile-web-app-title" content="澳賣GOT" />
    <title>澳賣GOT</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aomai-got-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', t === 'dark' ? '#111111' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
