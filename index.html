<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Capacitor WKWebView: lock scale at 1 so focus, blur, and double-tap
         cannot leave the visual viewport zoomed. Text controls are also >= 16px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="description" content="MoGOT — Macau neighborly secondhand bargaining" />
    <meta name="apple-mobile-web-app-title" content="澳賣GOT" />
    <title>澳賣GOT</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aomai-got-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', t === 'dark' ? '#111111' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
